name: "CI+CD"
run-name: {% raw %}${{ github.run_number }} [${{ github.actor }}] on ${{ github.ref_name }}{% endraw %}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Once a day at 12am UTC
  workflow_dispatch:

permissions: {}

# A concurrency group holds at most one running and one pending run; when another run arrives, the
# pending run is cancelled (regardless of `cancel-in-progress`).
#
# | Event                        | Example Group Key                     | Cancel In Progress | Effect                                               |
# |------------------------------|---------------------------------------|--------------------|------------------------------------------------------|
# | pull_request                 | CI+CD-refs/pull/42/merge-pull_request | Yes                | Superseded PR runs are cancelled                     |
# | push                         | CI+CD-refs/heads/main-push-<sha>      | No                 | Unique group per push; never queued or cancelled     |
# | schedule / workflow_dispatch | CI+CD-refs/heads/main-schedule        | No                 | Serialized per ref; newer pending run replaces older |
#
# Pushes are given unique groups because the release decision only examines the commits in its own
# push; a cancelled pending push run would silently skip its release.
concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}{% endraw %}
  cancel-in-progress: {% raw %}${{ github.event_name == 'pull_request' }}{% endraw %}

jobs:
  CICD_Workflow:
    name: "CI+CD Workflow"

    permissions:
      contents: write

    uses: ./.github/workflows/CICD_impl.yml

    with:
      # These values can be customized for your specific requirements.
      operating_system_json_string: "[ 'macos-latest', 'ubuntu-latest', 'windows-latest' ]"
      python_version_json_string: "{{ python_versions | to_python_list }}"
      build_python_version: "{{ (python_versions | to_python_list)[-1] }}"
      coverage_badge_gist_id: "{{ coverage_badge_gist_id }}"
      coverage_badge_gist_username: "{{ coverage_badge_gist_username }}"

    secrets:
      # These values should be populated as GitHub Action secrets ({{ github_url }}/settings/secrets/actions)
      MINISIGN_PRIVATE_KEY: {% raw %}${{ secrets.MINISIGN_PRIVATE_KEY }}{% endraw %}
      PYPI_PUBLISH_TOKEN: {% raw %}${{ secrets.PYPI_PUBLISH_TOKEN }}{% endraw %}
      COVERAGE_BADGE_GIST_TOKEN: {% raw %}${{ secrets.COVERAGE_BADGE_GIST_TOKEN }}{% endraw %}
